[project]
name = "todo-mcp"
version = "3.1.0"
description = "MCP server for Microsoft Todo with direct Graph API access"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
todo-mcp = "todo_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v"]
